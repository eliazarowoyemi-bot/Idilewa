<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Your Idilewa sign-in code</title>
  </head>
  <body style="margin:0;background:#f3f6f1;color:#20372b;font:16px/1.6 Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 14px;background:#f3f6f1">
      <tr><td align="center"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e4ebe2;border-radius:18px">
        <tr><td style="padding:26px 30px;background:#173f32;color:#fff;border-radius:18px 18px 0 0"><strong style="font-size:18px;letter-spacing:2px">Idilewa</strong><br><span style="font-size:12px;color:#dce9df">YOUR LEARNING SPACE</span></td></tr>
        <tr><td style="padding:32px 30px">
          <h1 style="margin:0 0 12px;color:#173f32;font-size:27px">Sign in to Idilewa</h1>
          <p style="margin:0 0 22px;color:#526358">Enter this one-time code on the Idilewa sign-in page:</p>
          <p style="margin:0 0 22px;padding:18px;text-align:center;background:#eaf6ec;border-radius:12px;color:#173f32;font-size:30px;font-weight:bold;letter-spacing:7px">{{ .Token }}</p>
          <p style="margin:0 0 20px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 20px;border-radius:999px;background:#28734d;color:#fff;text-decoration:none;font-weight:bold">Sign in securely</a></p>
          <p style="margin:0;color:#718076;font-size:13px">If you did not request this code, ignore this email. Never share your code with anyone.</p>
        </td></tr>
        <tr><td style="padding:18px 30px;background:#f8faf7;border-top:1px solid #e8eee6;color:#718076;font-size:13px">The Idilewa team · Keep your language close.</td></tr>
      </table></td></tr>
    </table>
  </body>
</html>
