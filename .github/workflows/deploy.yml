name: CI

# Production deploys are handled by Vercel (project "idilewa", scope
# "idilewa1", https://idilewa.com) on every push to main. This workflow only
# guards the test suite and the production build, so the former GitHub Pages
# deploy job (which always failed: Pages was never enabled) is gone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build project
        run: npm run build
