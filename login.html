<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F9FBF9" />
  <meta name="description" content="Sign in to your Idilewa family account." />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="canonical" href="https://www.idilewa.com/parents.html#/parent-login" />
  <meta name="robots" content="noindex" />
  <title>Sign in · Idilewa</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const hash = window.location.hash.replace(/^#\/?/, '');
      const hashMode = new URLSearchParams(hash.split('?')[1] || '').get('mode');
      const signup = params.get('mode') === 'signup' || hashMode === 'signup';
      window.location.replace(`/parents.html#/${signup ? 'parent-signup' : 'parent-login'}`);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/parents.html#/parent-login" /></noscript>
</head>
<body>
  <main>
    <h1>Sign in to Idilewa</h1>
    <p>Sign-in now lives on the family pages. <a href="/parents.html#/parent-login">Continue to parent login</a> or <a href="/parents.html#/parent-signup">create a parent account</a>.</p>
  </main>
</body>
</html>
